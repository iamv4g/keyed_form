name: keyed_form_flutter
description: >-
  The Flutter binding for keyed_form: a FormScope that publishes a
  FormController down the tree, KeyedFormField / KeyedFieldList widgets with
  selective rebuilds, a caret-safe text binding, and a FieldKey-addressed
  anchor registry for scroll-to-first-error.
version: 0.1.0
publish_to: 'none'

homepage: https://github.com/iamv4g/keyed_form
repository: https://github.com/iamv4g/keyed_form/tree/main/keyed_form_flutter
issue_tracker: https://github.com/iamv4g/keyed_form/issues

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  keyed_form: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
