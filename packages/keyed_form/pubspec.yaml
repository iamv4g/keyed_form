name: keyed_form
description: >-
  A form-state controller for immutable aggregates, built on keyed_lens: holds
  the working draft, FieldKey-addressed validation errors and
  touched/dirty/submit state.
version: 0.1.0
publish_to: 'none'

homepage: https://github.com/iamv4g/keyed_form
repository: https://github.com/iamv4g/keyed_form/tree/main/packages/keyed_form
issue_tracker: https://github.com/iamv4g/keyed_form/issues

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  keyed_lens: ^0.1.0
  listen: ^1.0.1
  meta: ^1.11.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
