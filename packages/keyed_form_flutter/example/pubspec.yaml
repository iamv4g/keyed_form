name: keyed_form_flutter_example
description: One screen per keyed_form_flutter pattern — sign in, invoice, packing list, itinerary, rebuild lab, and a full tour builder.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  keyed_form_flutter: ^0.1.0
  keyed_form_schema: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.0
  keyed_form_gen: ^0.1.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
