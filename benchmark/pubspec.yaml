name: keyed_form_benchmark
description: >-
  DX and performance comparison harness — keyed_form vs reactive_forms,
  flutter_form_builder and formz. Not published.
publish_to: none
version: 0.0.0

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # This is a test-support package: the widget harnesses expose `Finder`s.
  flutter_test:
    sdk: flutter
  keyed_form: ^0.1.0
  keyed_form_flutter: ^0.1.0
  keyed_form_schema: ^0.1.0
  reactive_forms: ^18.2.2
  # 10.3.x is the last line on plain package:flutter/material; 11.x moved to
  # package:material_ui, which most projects have not adopted yet.
  flutter_form_builder: ">=10.3.0 <11.0.0"
  form_builder_validators: ^11.3.0
  # Model-only (no widget layer): the typed, Bloc-native competitor. On the
  # model benchmark + DX table directly; on the widget sweep via flutter_bloc
  # (formz's own example pairing) — see lib/widget/formz_widget_harness.dart.
  formz: ^0.8.1
  flutter_bloc: ^9.1.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  keyed_form_gen: ^0.1.0

flutter:
  uses-material-design: true
