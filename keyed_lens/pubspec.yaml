name: keyed_lens
description: >-
  Keyed optics for immutable aggregates: composable total/affine lenses that
  each carry a stable, serializable FieldKey identity — the foundation for
  editors, field-keyed validation, dirty tracking, and server patches.
  Pure Dart, no Flutter dependency.
version: 0.1.0
