repository: https://github.com/iamv4g/keyed_form/tree/main/keyed_lens
issue_tracker: https://github.com/iamv4g/keyed_form/issues

environment:
  sdk: ^3.13.0

resolution: workspace

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
