name: keyed_form_gen
description: >-
  Code generator for keyed_schema: generates primary constructor data models,
  keyed lenses, and type-safe validation functions.
version: 0.1.0
publish_to: "none"

homepage: https://github.com/iamv4g/keyed_form
repository: https://github.com/iamv4g/keyed_form/tree/main/keyed_form_gen
issue_tracker: https://github.com/iamv4g/keyed_form/issues

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  analyzer: ^12.0.0
  build: any
  code_builder: any
  dart_style: any
  glob: any
  keyed_lens: ^0.1.0
  keyed_schema: ^0.1.0
  path: any
  source_gen: ^4.0.0

dev_dependencies:
  build_runner: any
  build_test: any
  lints: ^6.0.0
  test: ^1.25.0
