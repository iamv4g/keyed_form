name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # keyed_form_flutter needs the Flutter SDK; `flutter pub get` resolves
      # the whole workspace (pure-Dart packages included) in one pass.
      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Analyze (pure Dart packages)
        run: |
          set -e
          for pkg in keyed_lens keyed_form_core keyed_form_schema keyed_form_gen keyed_form; do
            echo "::group::dart analyze $pkg"
            (cd "packages/$pkg" && dart analyze)
            echo "::endgroup::"
          done

      - name: Analyze (keyed_form_flutter)
        run: flutter analyze
        working-directory: packages/keyed_form_flutter

      - name: Guard — generated code must not leak raw optics vocabulary
        run: |
          ! find packages -name '*.kfg.dart' \
            -exec grep -Hn -E '\bAffineLens\b|\bPrism\b|\bListItemLens\b|\bLens[<.]|\bOpt<' {} +

      # The examples ship their generated *.kfg.dart committed; CI checks they
      # still compile and (for the Flutter one) that the widgets behave.
      - name: Analyze (keyed_form_gen example)
        run: dart analyze
        working-directory: packages/keyed_form_gen/example

      - name: Analyze + test (keyed_form_flutter showcase example)
        run: |
          set -e
          flutter analyze
          flutter test
        working-directory: packages/keyed_form_flutter/examples/showcase

      - name: Test (pure Dart packages)
        run: |
          set -e
          for pkg in keyed_lens keyed_form_core keyed_form_schema keyed_form_gen keyed_form; do
            echo "::group::dart test $pkg"
            (cd "packages/$pkg" && dart test)
            echo "::endgroup::"
          done

      - name: Test (keyed_form_flutter)
        run: flutter test
        working-directory: packages/keyed_form_flutter
